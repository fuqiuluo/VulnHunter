# Harbor JobConfig: Benchmark vendor-official Agent CLI harnesses side-by-side
# Prerequisites:
#   export ANTHROPIC_API_KEY="sk-ant-..."
#   export OPENAI_API_KEY="sk-..."
#   export GEMINI_API_KEY="AIza..."
# Usage:
#   harbor run --config configs/official_harnesses.yaml

job_name: vulnhunter-official-harnesses
jobs_dir: "jobs"
n_concurrent_trials: 2
n_attempts: 1

datasets:
  - path: "datasets/vulnhunter-core"

agents:
  # Anthropic official Claude Code CLI harness (non-essential traffic disabled; WebSearch/WebFetch blocked in container)
  - name: claude-code
    model_name: anthropic/claude-sonnet-4-5
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"

  # OpenAI official Codex CLI harness (web_search locked to "disabled" via /etc/codex/requirements.toml)
  - name: codex
    model_name: openai/gpt-5-codex

  # Google official Gemini CLI harness (google_web_search & web_fetch excluded via /etc/gemini-cli/settings.json)
  - name: gemini-cli
    model_name: gemini/gemini-2.5-pro

environment:
  type: docker
  delete: true
