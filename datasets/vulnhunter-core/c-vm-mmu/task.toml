version = "1.0"

[metadata]
author_name = "VulnHunter Team"
author_email = "bench@vulnhunter.local"
difficulty = "hard"
category = "concurrency-safety"
tags = ["c", "virtualization", "mmu", "cve-2016-5195", "dirty-cow", "cwe-362", "cwe-269", "race-condition", "copy-on-write"]
expert_time_estimate_min = 40.0
junior_time_estimate_min = 90.0

[verifier]
timeout_sec = 120.0
network_mode = "no-network"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = [
    "api.anthropic.com",
    "api.openai.com",
    "generativelanguage.googleapis.com",
]

[environment]
build_timeout_sec = 300.0
network_mode = "public"
cpus = 4
memory_mb = 4096
storage_mb = 8192
