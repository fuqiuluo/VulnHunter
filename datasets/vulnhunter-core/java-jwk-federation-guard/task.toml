version = "1.0"

[metadata]
author_name = "VulnHunter Team"
author_email = "bench@vulnhunter.local"
difficulty = "hard"
category = "application-security"
tags = ["java", "openjdk", "oidc", "oauth2", "jws", "jwk", "dpop", "rfc9449", "rfc7638", "cryptography"]
expert_time_estimate_min = 90.0
junior_time_estimate_min = 240.0

[verifier]
timeout_sec = 180.0
network_mode = "no-network"

[agent]
timeout_sec = 2400.0
network_mode = "allowlist"
allowed_hosts = [
    "api.anthropic.com",
    "api.openai.com",
    "generativelanguage.googleapis.com",
]

[environment]
build_timeout_sec = 1200.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 8192
