version = "1.0"

[metadata]
author_name = "VulnHunter Team"
author_email = "bench@vulnhunter.local"
difficulty = "hard"
category = "firmware-security"
tags = ["c", "firmware", "microcode", "reverse-engineering", "cve-2025-21479", "cwe-863", "authorization"]
expert_time_estimate_min = 45.0
junior_time_estimate_min = 120.0

[verifier]
timeout_sec = 120.0
network_mode = "no-network"

[agent]
timeout_sec = 1500.0
network_mode = "allowlist"
allowed_hosts = [
    "api.anthropic.com",
    "api.openai.com",
    "generativelanguage.googleapis.com",
]

[environment]
build_timeout_sec = 300.0
network_mode = "public"
cpus = 2
memory_mb = 4096
storage_mb = 8192
